
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: tasktracker-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - tasktracker-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: tasktracker-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 3 &&
       ollama pull ${OLLAMA_EMBEDDING_MODEL} &&
       ollama pull ${OLLAMA_CHAT_MODEL} &&
       wait"

  app:
    image: ghcr.io/g-zak/task-tracker-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: tasktracker-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      WS_PORT: ${WS_PORT}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      WS_BROADCAST_SECRET: ${WS_BROADCAST_SECRET}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
    depends_on:
      postgres:
        condition: service_healthy

  ws:
    image: ghcr.io/g-zak/task-tracker-ws:latest
    build:
      context: .
      dockerfile: Dockerfile.ws
    container_name: tasktracker-ws
    restart: always
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      WS_PORT: 4001
      WS_BROADCAST_SECRET: ${WS_BROADCAST_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tasktracker-data:
  ollama-data:
